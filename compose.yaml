name: milton-crm

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: ${DOCKER_IMAGE_NAME:-milton-crm:latest}
  env_file:
    - ${ENV_FILE:-.env.production}
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 4173
    STORAGE_BACKEND: postgres
    UPLOAD_DIR: /app/uploads
    TRUST_PROXY: "false"
  depends_on:
    db:
      condition: service_healthy
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --data-checksums
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_MS:-500}
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - statement_timeout=60s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 256mb
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    cpus: ${POSTGRES_CPU_LIMIT:-2.0}

  app:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-4173}:4173"
    volumes:
      - receipt_files:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    stop_grace_period: 30s
    mem_limit: ${APP_MEMORY_LIMIT:-768m}
    cpus: ${APP_CPU_LIMIT:-1.5}

  migrate:
    <<: *app
    restart: "no"
    entrypoint: ["/sbin/tini", "--"]
    command: ["sh", "-c", "node scripts/migrate-postgres.js && node scripts/bootstrap-postgres.js"]

volumes:
  postgres_data:
  receipt_files:
